version: '3.8'

services:
  sync-server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    container_name: vps-vault-sync
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SYNC_TOKEN=change-this-to-a-strong-secret-token
      - VAULT_PATH=/data/vault
      - ARCHIVE_RETENTION_DAYS=30
      - MAX_FILE_SIZE_MB=100
      - SYNC_OBSIDIAN_CONFIG=true
      - SYNC_WORKSPACE=false
    volumes:
      # Mount your plain vault directory on your VPS host:
      - /path/to/your/vps/vault:/data/vault

  caddy:
    image: caddy:2-alpine
    container_name: vps-vault-sync-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=sync.yourdomain.com
      - EMAIL=admin@yourdomain.com
    volumes:
      - ./examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sync-server

volumes:
  caddy_data:
  caddy_config:
